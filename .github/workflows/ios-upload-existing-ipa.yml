name: Upload Existing StimPad IPA

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "GitHub run ID that produced StimPad-ipa artifact"
        required: true
        type: string

jobs:
  upload:
    runs-on: macos-26
    steps:
      - name: Require main
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Store builds only run from refs/heads/main (this run is ${GITHUB_REF})."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Require IPA built from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::source_run_id must be a numeric GitHub Actions run id."
            exit 1
          fi
          branch=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq .head_branch)
          if [ "$branch" != "main" ]; then
            echo "::error::Refusing to upload an IPA built from '${branch}'. Store uploads only come from main."
            exit 1
          fi
          echo "Source run ${SOURCE_RUN_ID} was built from main."

      - uses: actions/download-artifact@v4
        with:
          name: StimPad-ipa
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
          path: build
      - name: Verify and upload
        env:
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          chmod +x scripts/verify_ios_ipa_plugins.sh
          ./scripts/verify_ios_ipa_plugins.sh build/StimPad.ipa
          xcrun altool --upload-app -t ios -f build/StimPad.ipa \
            -u "$APPLE_ID_USERNAME" -p "$APPLE_ID_PASSWORD" --verbose
